name: Build and publish add-on

on:
  push:
    branches: [main]
    paths:
      - "hekr_bridge/**"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [main]
    paths:
      - "hekr_bridge/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  check-version:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get add-on version
        id: version
        run: |
          version=$(grep '^version:' hekr_bridge/config.yaml | sed 's/version: *"\(.*\)"/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check if this version was already released
        id: check
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Tag v${{ steps.version.outputs.version }} already exists — skipping build."
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  test-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for cross-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test build (no push)
        uses: docker/build-push-action@v6
        with:
          context: hekr_bridge
          platforms: linux/amd64,linux/arm64
          push: false

  build:
    needs: check-version
    if: github.event_name == 'push' && needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for cross-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner (GHCR requires lowercase image paths)
        id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch manifest
        uses: docker/build-push-action@v6
        with:
          context: hekr_bridge
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.lc }}/hekr-bridge:${{ needs.check-version.outputs.version }}
            ghcr.io/${{ steps.owner.outputs.lc }}/hekr-bridge:latest

  tag-release:
    needs: [check-version, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Tag this version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ needs.check-version.outputs.version }}"
          git push origin "v${{ needs.check-version.outputs.version }}"